<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Verify your email</title>
</head>
<body style="font-family: Arial, sans-serif; max-width: 600px; margin: auto; padding: 20px;">
    <h2>Welcome to EyeShop, <span th:text="${userName}">User</span>!</h2>
    <p>Please verify your email address by clicking the button below:</p>
    <p style="text-align: center; margin: 30px 0;">
        <a th:href="${verificationLink}"
           style="background: #4CAF50; color: white; padding: 12px 24px;
                  text-decoration: none; border-radius: 4px; display: inline-block;">
            Verify Email
        </a>
    </p>
    <p>Or copy this link in your browser:</p>
    <p><a th:href="${verificationLink}" th:text="${verificationLink}">link</a></p>
    <p style="color: #888; font-size: 12px;">
        This link expires in <span th:text="${expiryHours}">24</span> hours.
    </p>
    <hr>
    <p style="color: #888; font-size: 12px;">
        If you didn't create an account, ignore this email.
    </p>
</body>
</html>
