<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reset your password</title>
</head>
<body style="font-family: Arial, sans-serif; max-width: 600px; margin: auto; padding: 20px;">
    <h2>Password Reset Request</h2>
    <p>Hi <span th:text="${userName}">User</span>,</p>
    <p>We received a request to reset your password. Click below:</p>
    <p style="text-align: center; margin: 30px 0;">
        <a th:href="${resetLink}"
           style="background: #2196F3; color: white; padding: 12px 24px;
                  text-decoration: none; border-radius: 4px; display: inline-block;">
            Reset Password
        </a>
    </p>
    <p>Or copy this link:</p>
    <p><a th:href="${resetLink}" th:text="${resetLink}">link</a></p>
    <p style="color: #888; font-size: 12px;">
        This link expires in <span th:text="${expiryMinutes}">30</span> minutes.
    </p>
    <hr>
    <p style="color: #888; font-size: 12px;">
        If you didn't request this, ignore this email.
    </p>
</body>
</html>
